[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
sha2 = "0.10.9"
hex = "0.4.3"
rusqlite = { version = "0.36", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }